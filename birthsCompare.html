<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Births Comparison 2021 vs 2025</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f5f5f5;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
      }

      h1 {
        margin-bottom: 20px;
        color: #333;
        font-size: 24px;
        text-align: center;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-bottom: 25px;
        padding: 15px;
        background: #f9f9f9;
        border-radius: 6px;
      }

      .stat-item {
        text-align: center;
      }

      .stat-label {
        font-size: 12px;
        color: #666;
        text-transform: uppercase;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .stat-value {
        font-size: 18px;
        font-weight: bold;
        color: #333;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .data-table thead {
        background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
        color: white;
        position: sticky;
        top: 0;
      }

      .data-table th {
        padding: 12px 8px;
        text-align: left;
        border: none;
        cursor: pointer;
        user-select: none;
        font-weight: 600;
        white-space: nowrap;
      }

      .data-table th:hover {
        background: linear-gradient(135deg, #45a049 0%, #3d9142 100%);
      }

      .data-table th.sortable::after {
        content: " ⇅";
        font-size: 10px;
        opacity: 0.5;
      }

      .data-table th.sorted-asc::after {
        content: " ↑";
        opacity: 1;
      }

      .data-table th.sorted-desc::after {
        content: " ↓";
        opacity: 1;
      }

      .data-table td {
        padding: 10px 8px;
        border-bottom: 1px solid #eee;
      }

      .data-table tbody tr:hover {
        background: #f5f5f5;
      }

      .data-table tbody tr:nth-child(even) {
        background: #fafafa;
      }

      .number {
        text-align: right;
        font-family: "Courier New", monospace;
        font-size: 13px;
      }

      .change-positive {
        color: #4caf50;
        font-weight: 600;
      }

      .change-negative {
        color: #f44336;
        font-weight: 600;
      }

      .change-neutral {
        color: #999;
      }

      .raion-name {
        font-weight: 500;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Births Comparison 2021 vs 2025</h1>

      <div class="stats" id="stats">
        <div class="stat-item">
          <div class="stat-label">Total Raions</div>
          <div class="stat-value" id="stat-raions">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">2021 Births</div>
          <div class="stat-value" id="stat-2021">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">2025 Births</div>
          <div class="stat-value" id="stat-2025">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Change</div>
          <div class="stat-value" id="stat-change">0</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Avg Change %</div>
          <div class="stat-value" id="stat-change-pct">0%</div>
        </div>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th class="sortable" data-sort="name">Raion</th>
            <th class="sortable number" data-sort="births2021">2021</th>
            <th class="sortable number" data-sort="births2025">2025</th>
            <th class="sortable number" data-sort="change_abs">Change</th>
            <th class="sortable number" data-sort="change_pct">Change %</th>
            <th class="sortable number" data-sort="cbr2021">CBR 2021</th>
            <th class="sortable number" data-sort="cbr2025">CBR 2025</th>
            <th class="sortable number" data-sort="cbrDifference">CBR Diff</th>
          </tr>
        </thead>
        <tbody id="data-table-body"></tbody>
      </table>
    </div>

    <script>
      (async () => {
        // Load comparison data
        const comparisonData = await fetch("./birthsCompare.json").then((res) =>
          res.json(),
        );

        // Load population data
        const populationData = await fetch("./populationChange-data.json").then(
          (res) => res.json(),
        );

        // Create population map for quick lookup
        const populationMap = {};
        populationData.forEach((item) => {
          populationMap[item.name] = {
            population22: item.population22,
            population: item.population,
          };
        });

        // Merge comparison data with calculations
        const data = comparisonData.map((dataItem) => {
          const popData = populationMap[dataItem.name];

          let cbr2021 = null;
          let cbr2025 = null;
          let cbrDifference = null;
          let change_pct = dataItem.change_pct;

          // If 2025 is 0, change is -100%
          if (dataItem.births2025 === 0 && dataItem.births2021 > 0) {
            change_pct = -100;
          }

          if (popData) {
            cbr2021 = (dataItem.births2021 / popData.population22) * 1000;
            cbr2025 = (dataItem.births2025 / popData.population) * 1000;
            cbrDifference = cbr2025 - cbr2021;
          }

          return {
            ...dataItem,
            change_pct,
            cbr2021,
            cbr2025,
            cbrDifference,
          };
        });

        let filteredData = [...data];
        let currentSortKey = "name";
        let currentSortDesc = false;

        function sortData() {
          filteredData.sort((a, b) => {
            let aVal = a[currentSortKey];
            let bVal = b[currentSortKey];

            if (typeof aVal === "string") {
              aVal = aVal.toLowerCase();
              bVal = bVal.toLowerCase();
              return currentSortDesc
                ? bVal.localeCompare(aVal)
                : aVal.localeCompare(bVal);
            } else if (aVal === null || aVal === Infinity) {
              return 1;
            } else if (bVal === null || bVal === Infinity) {
              return -1;
            } else {
              return currentSortDesc ? bVal - aVal : aVal - bVal;
            }
          });
        }

        document.querySelectorAll(".sortable").forEach((th) => {
          th.addEventListener("click", function () {
            const key = this.dataset.sort;
            if (currentSortKey === key) {
              currentSortDesc = !currentSortDesc;
            } else {
              currentSortKey = key;
              currentSortDesc = false;
            }

            document.querySelectorAll(".sortable").forEach((t) => {
              t.classList.remove("sorted-asc", "sorted-desc");
            });

            if (currentSortDesc) {
              this.classList.add("sorted-desc");
            } else {
              this.classList.add("sorted-asc");
            }

            sortData();
            render();
            updateStats();
          });
        });

        function render() {
          const tbody = document.getElementById("data-table-body");
          tbody.innerHTML = filteredData
            .map(
              (d) => `
            <tr>
              <td class="raion-name">${d.name}</td>
              <td class="number">${d.births2021.toLocaleString()}</td>
              <td class="number">${d.births2025.toLocaleString()}</td>
              <td class="number ${d.change_abs >= 0 ? "change-positive" : "change-negative"}">
                ${d.change_abs >= 0 ? "+" : ""}${d.change_abs.toLocaleString()}
              </td>
              <td class="number ${d.change_pct === null ? "change-neutral" : d.change_pct >= 0 ? "change-positive" : "change-negative"}">
                ${d.change_pct === null || d.change_pct === Infinity ? "N/A" : (d.change_pct >= 0 ? "+" : "") + d.change_pct.toFixed(2) + "%"}
              </td>
              <td class="number">${d.cbr2021 !== null ? (Math.round(d.cbr2021 * 100) / 100).toFixed(2) : "N/A"}</td>
              <td class="number">${d.cbr2025 !== null ? (Math.round(d.cbr2025 * 100) / 100).toFixed(2) : "N/A"}</td>
              <td class="number ${d.cbrDifference !== null && d.cbrDifference >= 0 ? "change-positive" : d.cbrDifference !== null ? "change-negative" : "change-neutral"}">
                ${d.cbrDifference !== null ? (d.cbrDifference >= 0 ? "+" : "") + (Math.round(d.cbrDifference * 100) / 100).toFixed(2) : "N/A"}
              </td>
            </tr>
          `,
            )
            .join("");
        }

        function updateStats() {
          const numRaions = filteredData.length;
          const totalBirths2021 = filteredData.reduce(
            (sum, d) => sum + (d.births2021 || 0),
            0,
          );
          const totalBirths2025 = filteredData.reduce(
            (sum, d) => sum + (d.births2025 || 0),
            0,
          );
          const totalChange = totalBirths2025 - totalBirths2021;
          const avgChangePct =
            numRaions > 0 && totalBirths2021 > 0
              ? ((totalChange / totalBirths2021) * 100).toFixed(2)
              : "0.00";

          document.getElementById("stat-raions").textContent = numRaions;
          document.getElementById("stat-2021").textContent =
            totalBirths2021.toLocaleString();
          document.getElementById("stat-2025").textContent =
            totalBirths2025.toLocaleString();
          document.getElementById("stat-change").textContent =
            (totalChange >= 0 ? "+" : "") + totalChange.toLocaleString();
          document.getElementById("stat-change-pct").textContent =
            (avgChangePct >= 0 ? "+" : "") + avgChangePct + "%";
        }

        // Initial sort and render
        sortData();
        render();
        updateStats();
      })();
    </script>
  </body>
</html>
